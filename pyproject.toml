# Homeo as an installable package, so that its modules -- which import each
# other as top-level packages (from Helpers.X import ..., from Core.Y import
# ...) -- are importable from any directory, not only from src/.
#
# Install it EDITABLE, once per environment:
#
#     pip install -e .                    # a venv (Grace: grace_setup.sh does it)
#     pip install --user --break-system-packages --no-deps -e .
#                                         # a distribution's system Python (Arch)
#
# Editable, not a regular install: Helpers.General_Helper_Functions finds
# SimulationsData relative to its own file, which must stay in the checkout.
# --no-deps on a system Python: the dependencies come from the distribution's
# packages there (pacman's Box2D is not even named box2d-py), and pip would
# otherwise shadow them with its own copies in ~/.local.

[build-system]
requires = ["setuptools>=77"]      # 77: the SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "homeo"
version = "0.1.0"
description = "Simulation of Ashby's homeostat and homeostat-controlled Braitenberg vehicles"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Stefano Franchi" }]
license = "GPL-3.0-or-later"
license-files = ["license.txt"]
# The same as requirements.txt, minus the optional parts (the extras below).
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tabulate>=0.9",
    "pyglet>=2.1",
]
# Box2D (the Box2D simulator's physics) is not listed here: it is one module,
# `Box2D`, shipped under two distribution names, and Homeo works with either.
# PyPI's `box2d-py` (no wheel for current CPythons: built from source with
# swig, as hpc/grace_setup.sh does) or `Box2D` (e.g. Arch's python-box2d,
# 2.3.10).  Requiring one name would make `pip check` fail wherever the other
# is installed.  Install it first, or with the extra below, which names
# box2d-py:  pip install -e ".[box2d]"

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.14"]
box2d = ["box2d-py>=2.3.8"]
ga = ["deap>=1.4", "dill>=0.3"]
# numba: the HPC runs use HomeoJIT compiled (hpc/grace_setup.sh installs it),
# so the tests must exercise the compiled code too, not only its pure-Python
# fallback.  The suite also passes without it.  Pinned, as in requirements.txt:
# numba's own generator draws the headless runs' noise.
test = ["pytest>=9.0", "numba==0.68.*"]

[project.scripts]
homeo-traj = "Helpers.TrajectoryGrapher:main"
homeo-strip = "Helpers.StripchartGrapher:main"
homeo-statelog = "Helpers.StatelogAnalyzer:main"
homeo-tikz = "Helpers.HomeostatDiagramTikz:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["Core*", "Helpers*", "Simulator*", "KheperaSimulator*",
           "RobotSimulator*", "HomeoExperiments*", "WebotsSimulator*"]

[tool.ruff.lint]
# Modules use CamelCase file names (HomeoExperiments.py etc.); renaming would break imports.
ignore = ["N999"]
